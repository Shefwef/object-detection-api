name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lightweight test dependencies
        # We deliberately skip the heavy ML deps (torch, ultralytics, detectron2, sam)
        # because tests use a StubModel and never actually load real weights.
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi==0.115.6 \
            uvicorn==0.34.0 \
            python-multipart==0.0.19 \
            pydantic==2.10.4 \
            pydantic-settings==2.7.1 \
            opencv-python-headless==4.10.0.84 \
            numpy==1.24.3 \
            Pillow \
            pytest==8.3.4 \
            pytest-asyncio==0.24.0 \
            httpx==0.28.1 \
            structlog

      - name: Run repository + service + endpoint tests
        run: |
          pytest tests/test_repositories.py tests/test_detection_service.py -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: Type-check
        run: npm run typecheck

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api/backend
        run: npm run build
