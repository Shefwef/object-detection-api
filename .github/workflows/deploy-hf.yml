name: Deploy backend to Hugging Face Spaces

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "requirements.txt"
      - "Dockerfile"
      - "deployment/hf/**"
      - ".github/workflows/deploy-hf.yml"
  workflow_dispatch:

# Prevent overlapping deploys when multiple commits land quickly.
concurrency:
  group: hf-space-deploy
  cancel-in-progress: false

jobs:
  push-to-space:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Prepare Hugging Face payload
        env:
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          set -e
          if [ -z "$HF_USERNAME" ] || [ -z "$HF_SPACE_NAME" ]; then
            echo "::error::HF_USERNAME and HF_SPACE_NAME secrets are required."
            exit 1
          fi
          # HF expects README.md at the Space root — swap in the HF-flavoured one.
          cp deployment/hf/README.md README.md

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          set -e
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is required."
            exit 1
          fi
          git config --global user.email "deploy-bot@users.noreply.github.com"
          git config --global user.name "HF Space Deploy Bot"

          REMOTE="https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}"

          git add README.md
          git commit -m "ci: sync HF Space README" || echo "no README delta"

          git remote add space "$REMOTE"
          git push space HEAD:main --force
