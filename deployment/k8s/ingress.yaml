# ════════════════════════════════════════════════════════════
#  Kubernetes Ingress — Routes external HTTP traffic to the API
# ════════════════════════════════════════════════════════════
#
#  Requires an Ingress controller (e.g., NGINX Ingress or AWS ALB).
#
#  For AWS EKS with ALB Ingress Controller, add annotation:
#    kubernetes.io/ingress.class: alb

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cv-detection-ingress
  namespace: cv-detection
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"     # Allow 10MB uploads
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"   # Model inference timeout
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cv-detection-service
                port:
                  number: 80
